[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tomo_project"
version = "0.0.1"
description = "Tomographic data analysis - import pipeline skeleton"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "tifffile",
]

[project.optional-dependencies]
dev = ["pytest"]
# Only needed for preprocessing.remove_zinger()/remove_ring_artifacts()/
# process_volume(), the "algotom_fbp" reconstruction backend, and the
# "algotom_cor" calibration backend. `pip install .[preprocessing]` to
# get it; without it, those specific functions/backends raise a clear
# ImportError telling you to install this extra rather than failing to
# import the whole package.
preprocessing = ["algotom"]

[tool.setuptools]
packages = [
    "core", "data_import", "data_import.vendors",
    "completion", "preprocessing",
    "calibration", "calibration.backends",
    "reconstruction", "reconstruction.backends",
]
